services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omni_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  mlflow:
    profiles: ["observability"]
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  backend:
    profiles: ["docker-app"]
    image: python:3.10-slim
    command: bash -c "echo 'Backend container running...' && tail -f /dev/null"
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./ai_module:/app
    working_dir: /app
    restart: always

  frontend:
    profiles: ["docker-app"]
    image: node:18-alpine
    command: sh -c "echo 'Frontend container running...' && tail -f /dev/null"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    working_dir: /app
    restart: always

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    restart: always

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  qdrant_data:
  redis_data:
