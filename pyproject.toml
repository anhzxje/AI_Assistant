[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-assistant-data-platform"
version = "0.1.0"
description = "Institutional data ingestion and feature pipeline for the OmniAssistant project."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "lxml>=5.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "tenacity>=8.2.3",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
parsing = [
  "pymupdf>=1.24.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
]
features = [
  "qdrant-client>=1.9.0",
  "sentence-transformers>=3.0.0",
]
storage = [
  "psycopg[binary]>=3.1.18",
  "redis>=5.0.4",
]
google = [
  "google-api-python-client>=2.140.0",
  "google-auth-oauthlib>=1.2.1",
]
voice = [
  "faster-whisper>=1.0.0",
  "edge-tts>=6.1.12",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_platform*", "backend*", "orchestration*", "ai_module*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
